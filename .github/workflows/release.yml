# Automatic release vX.Y.Z after every push to main — see
# scripts/release.mjs (the source of truth is the doc page registry; the
# epoch X is raised only by a `release!:` commit). The release commit
# itself is skipped, otherwise the workflow would trigger itself.
#
# The version bump does not go to main directly — main accepts no direct
# push. The script sends it as a pull request with auto-merge, and
# therefore needs more than writing to contents: to open the PR and to
# trigger ci.yml so the required checks are on it.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags and history since the last release — a shallow checkout
          # would see neither the tag nor the commits to analyse.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/release.mjs
