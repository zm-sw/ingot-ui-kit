name: ci

# ``workflow_dispatch`` is not here for manual runs but for the release:
# a PR opened with GITHUB_TOKEN does not trigger a ``pull_request`` run, so
# the required checks would never appear on the release PR and auto-merge
# would wait forever. Dispatch is the exception GITHUB_TOKEN may trigger.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Repo checks (guards, lint, formatting)
        run: npm run check
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build doc web
        # The full build, not just `vite build`: the prerender step writes
        # one HTML file per address, and a page whose content cannot be
        # rendered in node must fail here rather than ship as an empty
        # shell that still looks like a page. The bundle budget runs inside
        # it too — a bundle does not get big in one commit, it gets big in
        # forty that were each obviously fine.
        run: npm run build

  version-guard:
    # On a push to main there is nothing to compare against; on dispatch
    # there is — and it has to finish, otherwise the required check on the
    # release PR would be missing.
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Component change requires a version bump
        run: node scripts/version_guard.mjs origin/${{ github.base_ref || 'main' }}

  # The reference consumer: builds an application against the PACKED kit,
  # so a leaked relative path, a missing export, an undeclared peer or a
  # type only this repository's tsconfig supplies fails here instead of at
  # somebody else's first install.
  #
  # Not on every pull request, because it installs a second node_modules
  # tree and most changes cannot break it. It runs on main, and on a PR
  # labelled `consumer` when the change is one that could — anything
  # touching the package manifest or the shape of what ships.
  consumer:
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'consumer')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pack the kit as a consumer receives it
        run: npm run consumer:pack
      - name: Build the example against the packed kit
        working-directory: examples/consumer
        # install, not ci: the example has no lockfile of its own — it would
        # record the kit's version and go stale at every release.
        run: npm install --no-audit --no-fund && npm run build

  # Lighthouse on the built doc web.
  #
  # Two tickets carried a Lighthouse number in their acceptance and nobody
  # ever measured one, because it needs a served site — so the figures that
  # existed came from curl, and a transfer size is not a score. Without a
  # score there is no way to say whether the site is getting slower.
  #
  # Measured against the built site served locally, not against the Vercel
  # preview: a job that waits for a bot's comment to appear is a job that
  # fails for reasons no reader can act on. What this does not see is the
  # CDN's compression and caching, so Performance reads LOWER here than on
  # the live site — the safe direction for a budget to be wrong in.
  #
  # `continue-on-error` on purpose, and with a date on it. The scores land
  # as a comment from today; on 2026-10-06 the flag comes off and this
  # becomes a required check. A threshold nobody has watched for a month is
  # a threshold that blocks the first unrelated pull request and then gets
  # switched off.
  lighthouse:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build doc web
        run: npm run build
      - name: Serve it and measure
        id: measure
        continue-on-error: true
        run: |
          npx vite preview --port 4173 --strictPort &
          npx wait-on http://localhost:4173 --timeout 60000
          npx --yes @lhci/cli@0.14.x autorun
      - name: Summarise the scores
        id: summary
        if: always()
        run: |
          {
            echo 'body<<LIGHTHOUSE_EOF'
            node scripts/lighthouse-summary.mjs
            echo LIGHTHOUSE_EOF
          } >> "$GITHUB_OUTPUT"
      - name: Say so on the pull request
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const body = process.env.BODY;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            // One comment that gets edited, not one per push: a pull
            // request with nine Lighthouse comments is a pull request
            // nobody reads the review of.
            const existing = await github.rest.issues.listComments({
              owner, repo, issue_number, per_page: 100,
            });
            const mine = existing.data.find(
              (comment) =>
                comment.user.type === "Bot" && comment.body.startsWith("### Lighthouse"),
            );
            if (mine) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: mine.id, body,
              });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
        env:
          BODY: ${{ steps.summary.outputs.body }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse
          path: .lighthouseci
          if-no-files-found: ignore
