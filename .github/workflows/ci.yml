name: ci

# ``workflow_dispatch`` tu není pro ruční spouštění, ale pro release:
# PR, které založí GITHUB_TOKEN, nespustí ``pull_request`` běh, takže by
# se povinné checky na release PR nikdy neobjevily a auto-merge by čekal
# navěky. Dispatch je výjimka, kterou GITHUB_TOKEN spustit smí.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Repo checks (doc-pages, kit-only, no-internal-prose)
        run: npm run check
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build doc web
        run: npx vite build

  version-guard:
    # Na pushi do main nemá co porovnávat; na dispatchi ano — a musí
    # doběhnout, jinak by povinný check na release PR chyběl.
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Component change requires a version bump
        run: node scripts/version_guard.mjs origin/${{ github.base_ref || 'main' }}
