name: ci

# ``workflow_dispatch`` is not here for manual runs but for the release:
# a PR opened with GITHUB_TOKEN does not trigger a ``pull_request`` run, so
# the required checks would never appear on the release PR and auto-merge
# would wait forever. Dispatch is the exception GITHUB_TOKEN may trigger.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Repo checks (guards, lint, formatting)
        run: npm run check
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build doc web
        # The full build, not just `vite build`: the prerender step writes
        # one HTML file per address, and a page whose content cannot be
        # rendered in node must fail here rather than ship as an empty
        # shell that still looks like a page.
        run: npm run build

  version-guard:
    # On a push to main there is nothing to compare against; on dispatch
    # there is — and it has to finish, otherwise the required check on the
    # release PR would be missing.
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Component change requires a version bump
        run: node scripts/version_guard.mjs origin/${{ github.base_ref || 'main' }}

  # The reference consumer: builds an application against the PACKED kit,
  # so a leaked relative path, a missing export, an undeclared peer or a
  # type only this repository's tsconfig supplies fails here instead of at
  # somebody else's first install.
  #
  # Not on every pull request, because it installs a second node_modules
  # tree and most changes cannot break it. It runs on main, and on a PR
  # labelled `consumer` when the change is one that could — anything
  # touching the package manifest or the shape of what ships.
  consumer:
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'consumer')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pack the kit as a consumer receives it
        run: npm run consumer:pack
      - name: Build the example against the packed kit
        working-directory: examples/consumer
        # install, not ci: the example has no lockfile of its own — it would
        # record the kit's version and go stale at every release.
        run: npm install --no-audit --no-fund && npm run build
