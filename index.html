<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c0a09" />
    <!-- The favicon is the mark cropped from the logo, not a drawing of its
         own. Two variants because the mark is an outline and in the dark:
         the ink is almost black and would vanish on a dark tab strip. The
         order is deliberate — the browser takes the LAST matching <link>,
         so the dark one must come after the light one, otherwise it would
         win in light mode. -->
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link
      rel="icon"
      href="/favicon-dark.png"
      type="image/png"
      media="(prefers-color-scheme: dark)"
    />
    <title>Ingot UI Kit</title>
    <!-- The doc web has no tenant, so no branding middleware either — the
         title is static. The anti-flash script: dark mode holds `.dark` on
         <html> and without it a cold load would flash light→dark. -->
    <script src="/theme-init.js"></script>
    <!-- The language of the root address, which is the one page whose
         language is the reader's rather than the URL's. Every other page
         carries it in its own prerendered file. -->
    <script src="/lang-init.js"></script>
  </head>
  <body class="min-h-screen bg-bg text-ink antialiased">
    <div id="root"></div>
    <script type="module" src="/src/ingot-docs/main.tsx"></script>
  </body>
</html>
