<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c0a09" />
    <!-- Favicon je oriznuta znacka z loga, ne vlastni kresba. Dve varianty
         proto, ze znacka je obrysova a v tmavem: inkoust je skoro cerny
         a na tmavem panelu zalozek by zmizel. Poradi je zamer — prohlizec
         bere POSLEDNI vyhovujici <link>, takze tmava musi byt az za
         svetlou, jinak by ve svetlem rezimu vyhrala. -->
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link
      rel="icon"
      href="/favicon-dark.png"
      type="image/png"
      media="(prefers-color-scheme: dark)"
    />
    <title>Ingot UI Kit</title>
    <!-- Doc web nemá tenanta, takže ani brandovací middleware — titulek je
         statický. Anti-flash skript je týž jako u hlavního entry: dark mode
         drží `.dark` na <html> a bez něj by studený load blikl light→dark. -->
    <script src="/theme-init.js"></script>
  </head>
  <body class="min-h-screen bg-bg text-ink antialiased">
    <div id="root"></div>
    <script type="module" src="/src/ingot-docs/main.tsx"></script>
  </body>
</html>
